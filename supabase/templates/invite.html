<!-- Modelo de e-mail "Invite user" do Supabase. O convidado define a própria senha em /redefinir-senha. -->
<div style="font-family: Arial, Helvetica, sans-serif; background:#0a0a0a; padding:32px; color:#f5f5f5;">
  <div style="max-width:480px; margin:0 auto; background:#141414; border:1px solid #2a2a2a; border-radius:16px; padding:32px;">
    <h1 style="margin:0 0 12px; font-size:22px; color:#ffffff;">Seu acesso ao Aprova Luvi</h1>
    <p style="margin:0 0 24px; color:#9ca3af; line-height:1.5;">
      A Luvi Company criou um acesso para você acompanhar e aprovar materiais.
      Clique abaixo para escolher a sua senha.
    </p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next=/redefinir-senha"
       style="display:inline-block; background:#ff3b00; color:#ffffff; text-decoration:none; font-weight:700; padding:14px 28px; border-radius:999px;">
      Criar minha senha
    </a>
    <p style="margin:24px 0 0; color:#6b7280; font-size:12px;">O link expira em pouco tempo e só pode ser usado uma vez.</p>
  </div>
</div>
