# Configuração para o Supabase CLI (desenvolvimento local com `supabase start`).
# No projeto em nuvem, os mesmos ajustes são feitos em Authentication > Settings (veja
# docs/SUPABASE.md). Este arquivo documenta o que o app espera.

project_id = "aprova-luvi"

[api]
enabled = true

[db]
major_version = 17

[auth]
enabled = true
# Este arquivo é SÓ de desenvolvimento local: aponta apenas para localhost. A produção tem o
# próprio projeto e a própria configuração (veja docs/SUPABASE.md); nunca aplique este arquivo
# nela, nem coloque o domínio de produção aqui.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/*"]
# Sem cadastro livre: contas só nascem por convite da equipe.
enable_signup = false
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Mesma regra do app (src/lib/auth/password.ts). No projeto em nuvem isto é configurado no painel.
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true

[auth.email.template.recovery]
subject = "Redefinir sua senha — Aprova Luvi"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "Seu acesso ao Aprova Luvi"
content_path = "./supabase/templates/invite.html"
